name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate data, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate evidence data against the schema
        run: npm run validate

      - name: Build the site
        run: npm run build

      - name: Run the test suite
        run: npm test

      - name: Flag entries not reviewed in over a year
        run: node scripts/staleness.mjs
        continue-on-error: true
